name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: qualitypilot_test
          POSTGRES_USER: qualitypilot_test
          POSTGRES_PASSWORD: qualitypilot_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qualitypilot_test -d qualitypilot_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      DATABASE_URL: postgresql+asyncpg://qualitypilot_test:qualitypilot_test_password@127.0.0.1:5432/qualitypilot_test
      TEST_DATABASE_URL: postgresql+asyncpg://qualitypilot_test:qualitypilot_test_password@127.0.0.1:5432/qualitypilot_test
      ENVIRONMENT: test
      DEBUG: "false"
      UPLOAD_DIRECTORY: /tmp/qualitypilot-test-uploads
      DASHSCOPE_API_KEY: ""

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check dependencies and syntax
        run: |
          python -m pip check
          python -m compileall -q app tests

      - name: Upgrade isolated test database
        run: alembic upgrade head

      - name: Check migration state
        run: alembic check

      - name: Run tests
        run: python -m pytest -q
